# Namespace + Deployment with requests/limits and probes (the base for HPA/VPA).
apiVersion: v1
kind: Namespace
metadata: {name: apache}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: apache-deployment, namespace: apache}
spec:
  replicas: 1
  selector:
    matchLabels: {app: apache}
  template:
    metadata:
      labels: {app: apache}
    spec:
      containers:
        - name: apache
          image: httpd:2.4
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}   # used by scheduler + HPA %
            limits: {cpu: 200m, memory: 256Mi}     # hard cap (CPU throttled, memory OOMKilled)
          startupProbe:                            # slow starters get time before other probes run
            httpGet: {path: /, port: 80}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:                          # false -> removed from Service endpoints
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:                           # fails -> container restarted
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: apache-service, namespace: apache}
spec:
  selector: {app: apache}
  ports: [{port: 80, targetPort: 80}]
