# Real world: give each team a fair share of the cluster.
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-quota, namespace: apache}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange                     # defaults for pods that forget to set resources
metadata: {name: default-limits, namespace: apache}
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 100m, memory: 128Mi}
