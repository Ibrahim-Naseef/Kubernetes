kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatch.kubernetes.com
spec:
  group: kubernetes.com
  names:
    kind: DevopsBatch
    plural: devopsbatch
    singular: devops
    shortNames:
    - dv
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the DevOps batch job
                duration:
                  type: string
                  description: Duration of the DevOps batch job
                mode:
                  type: string
                  description: Mode of the DevOps batch job
                platform:
                  type: string
                  description: Platform of the DevOps batch job