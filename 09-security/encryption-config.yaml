# Encrypt Secrets at rest in etcd. Passed to kube-apiserver:
#   --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
# Generate key: head -c 32 /dev/urandom | base64
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources: ["secrets"]
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: <BASE64_32_BYTE_KEY>
      - identity: {}      # fallback so old unencrypted secrets can still be read
