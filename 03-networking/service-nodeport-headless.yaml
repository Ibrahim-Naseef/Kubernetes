# NodePort: expose on every node's IP (dev/testing only)
apiVersion: v1
kind: Service
metadata: {name: nginx-nodeport, namespace: nginx}
spec:
  type: NodePort
  selector: {app: nginx}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
# LoadBalancer: cloud provider creates an external LB (EKS/AKS/GKE)
apiVersion: v1
kind: Service
metadata: {name: nginx-lb, namespace: nginx}
spec:
  type: LoadBalancer
  selector: {app: nginx}
  ports: [{port: 80, targetPort: 80}]
