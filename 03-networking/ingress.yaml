# Real world: one entry point, many services (shop.example.com/api -> api, / -> web)
# Requires an ingress controller (see README). Both Services must be in the SAME namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - path: /web(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: nginx-service, port: {number: 80}}
