# 1) Default deny all ingress traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: mysql}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2) Only pods labelled app=backend may reach MySQL on 3306
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-backend-to-mysql, namespace: mysql}
spec:
  podSelector:
    matchLabels: {app: mysql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: backend}
          podSelector:
            matchLabels: {app: backend}
      ports: [{protocol: TCP, port: 3306}]
