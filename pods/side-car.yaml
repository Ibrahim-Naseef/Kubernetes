kind: Pod
apiVersion: v1
metadata:
  name: sidecar-test

spec:
  volumes:
  - name: shared-logs
    emptyDir: {}
  containers:
  - name: main-container
    image: busybox:latest
    command: ['sh', '-c', 'while true; do echo "The main container is running!" >> /var/log/app.log && sleep 5; done']
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/

  - name: sidecar-container
    image: busybox:latest
    command: ['sh', '-c', 'touch /var/log/app.log && tail -f /var/log/app.log']
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/